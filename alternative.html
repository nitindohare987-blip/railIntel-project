<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alternative Route | RailIntel</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #312e81,
                    #6366f1
                );

            color: white;
        }

        /* ================= NAVBAR ================= */

        nav {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px 80px;

            background: #020617;

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            position: sticky;

            top: 0;

            z-index: 1000;
        }

        .logo {

            font-size: 2.4rem;

            font-weight: 700;

            color: #b026ff;
        }

        nav ul {

            display: flex;

            list-style: none;

            gap: 32px;
        }

        nav ul li a {

            color: #94a3b8;

            text-decoration: none;

            font-size: 0.95rem;

            transition: 0.2s;

            position: relative;
        }

        nav ul li a:hover {

            color: white;
        }

        nav ul li a::after {

            content: "";

            position: absolute;

            bottom: -4px;

            left: 0;

            width: 0;

            height: 1px;

            background: #b026ff;

            transition: 0.25s;
        }

        nav ul li a:hover::after {

            width: 100%;
        }

        /* ================= HEADING ================= */

        h1 {

            text-align: center;

            margin-top: 40px;

            margin-bottom: 25px;

            font-size: 1.5rem;

            font-weight: 600;

            letter-spacing: 0.5px;
        }

        /* ================= CARD ================= */

        .box1 {

            width: 90%;

            max-width: 500px;

            margin: 0 auto 60px;

            background: #020617;

            padding: 28px 24px;

            border-radius: 14px;

            border:
                1px solid rgba(255,255,255,0.07);

            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        /* ================= INPUT GROUP ================= */

        .input-group {

            position: relative;

            width: 100%;
        }

        /* ================= INPUT ================= */

        input {

            width: 100%;

            padding: 11px 14px;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 8px;

            background: #0f172a;

            color: white;

            font-size: 0.88rem;

            outline: none;

            transition: 0.2s;
        }

        input::placeholder {

            color: #475569;
        }

        input:focus {

            border-color: #6366f1;
        }

        /* ================= SUGGESTIONS ================= */

        .suggestions {

            position: absolute;

            top: calc(100% + 5px);

            left: 0;

            width: 100%;

            background: #0f172a;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 9px;

            overflow: hidden;

            display: none;

            z-index: 2000;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.4);
        }

        .suggestion {

            padding: 10px 13px;

            cursor: pointer;

            border-bottom:
                1px solid rgba(255,255,255,0.05);

            transition: 0.2s;
        }

        .suggestion:last-child {

            border-bottom: none;
        }

        .suggestion:hover {

            background: #1e293b;
        }

        .station-name {

            color: #f8fafc;

            font-size: 0.87rem;

            font-weight: 500;
        }

        .station-code {

            color: #94a3b8;

            font-size: 0.73rem;

            margin-top: 2px;
        }

        /* ================= DIVIDER ================= */

        .divider {

            border: none;

            border-top:
                1px solid rgba(255,255,255,0.07);

            margin: 2px 0;
        }

        /* ================= BUTTON ================= */

        #btn {

            width: 100%;

            padding: 11px;

            border: none;

            border-radius: 10px;

            background: #6366f1;

            color: white;

            font-size: 0.92rem;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }

        #btn:hover {

            background: #4f46e5;

            transform: translateY(-2px);

            box-shadow:
                0 6px 18px rgba(99,102,241,0.35);
        }

        #btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        /* ================= RESULT ================= */

        #result {

            display: none;

            text-align: left;

            font-size: 0.85rem;

            line-height: 1.6;

            background: #0f172a;

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 10px;

            padding: 15px;
        }

        /* ================= RESULT HEADER ================= */

        .result-title {

            text-align: center;

            color: #e2e8f0;

            font-size: 0.95rem;

            font-weight: 600;

            margin-bottom: 6px;
        }

        .route-path {

            text-align: center;

            color: #94a3b8;

            font-size: 0.78rem;

            margin-bottom: 15px;
        }

        /* ================= DIRECT ================= */

        .direct-box {

            background:
                rgba(34,197,94,0.08);

            border:
                1px solid rgba(34,197,94,0.25);

            border-radius: 9px;

            padding: 12px;

            margin-bottom: 15px;
        }

        .direct-title {

            color: #86efac;

            font-weight: 600;

            margin-bottom: 8px;
        }

        /* ================= ALTERNATIVE TITLE ================= */

        .alternative-heading {

            color: #facc15;

            font-weight: 600;

            margin: 12px 0;
        }

        /* ================= ALTERNATIVE CARD ================= */

        .alternative-card {

            background: #111827;

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 10px;

            padding: 13px;

            margin-top: 12px;
        }

        .alternative-title {

            color: #facc15;

            font-size: 0.88rem;

            font-weight: 600;

            margin-bottom: 10px;
        }

        /* ================= LEG ================= */

        .leg {

            background: #0f172a;

            border-left:
                3px solid #6366f1;

            border-radius: 7px;

            padding: 10px;

            margin-top: 9px;
        }

        .leg-title {

            color: #c4b5fd;

            font-size: 0.8rem;

            font-weight: 600;

            margin-bottom: 7px;
        }

        /* ================= TRAIN ================= */

        .train {

            padding: 8px 0;

            border-bottom:
                1px solid rgba(255,255,255,0.05);
        }

        .train:last-child {

            border-bottom: none;
        }

        .train-main {

            font-size: 0.8rem;
        }

        .train-number {

            color: #a78bfa;

            font-weight: 600;
        }

        .train-name {

            color: #f8fafc;

            font-weight: 500;
        }

        .train-details {

            color: #94a3b8;

            font-size: 0.72rem;

            margin-top: 2px;
        }

        /* ================= LOADING ================= */

        .loading {

            text-align: center;

            color: #c4b5fd;

            padding: 8px;
        }

        /* ================= ERROR ================= */

        .error {

            color: #fca5a5;

            background:
                rgba(239,68,68,0.08);

            border:
                1px solid rgba(239,68,68,0.25);

            border-radius: 8px;

            padding: 11px;

            text-align: center;
        }

        /* ================= NO RESULT ================= */

        .no-result {

            color: #facc15;

            text-align: center;

            padding: 8px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            nav {

                padding: 14px 20px;

                flex-direction: column;

                gap: 12px;
            }

            .logo {

                font-size: 2rem;
            }

            nav ul {

                gap: 18px;

                flex-wrap: wrap;

                justify-content: center;
            }

            nav ul li a {

                font-size: 0.82rem;
            }

            h1 {

                margin-top: 30px;

                font-size: 1.35rem;
            }

        }

        @media (max-width: 480px) {

            nav {

                padding: 12px 15px;
            }

            .logo {

                font-size: 1.8rem;
            }

            nav ul {

                gap: 12px;
            }

            nav ul li a {

                font-size: 0.76rem;
            }

            .box1 {

                width: 92%;

                padding: 22px 18px;
            }

            h1 {

                font-size: 1.25rem;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        रेल<span style="color:#94a3b8;">Intel</span>
    </div>

    <ul>

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="#">
                About
            </a>
        </li>

        <li>
            <a href="#">
                FAQs
            </a>
        </li>

        <li>
            <a href="#">
                Contact
            </a>
        </li>

    </ul>

</nav>


<!-- ================= HEADING ================= -->

<h1>
    Alternative Route Finder
</h1>


<!-- ================= MAIN CARD ================= -->

<div class="box1">


    <!-- FROM -->

    <div class="input-group">

        <input
            type="text"
            id="from"
            placeholder="From (e.g. Gwalior)"
            autocomplete="off"
        >

        <div
            id="fromSuggestions"
            class="suggestions"
        ></div>

    </div>


    <!-- TO -->

    <div class="input-group">

        <input
            type="text"
            id="to"
            placeholder="To (e.g. Indore)"
            autocomplete="off"
        >

        <div
            id="toSuggestions"
            class="suggestions"
        ></div>

    </div>


    <hr class="divider">


    <!-- BUTTON -->

    <button
        id="btn"
        onclick="findAlternativeRoute()"
    >
        Find Route
    </button>


    <!-- RESULT -->

    <div id="result"></div>


</div>



<script>


/* =====================================================
   RENDER BACKEND
   ===================================================== */

const API_BASE =
    "https://railintel-project.onrender.com";


/* =====================================================
   SELECTED STATIONS
   ===================================================== */

let selectedFrom = null;

let selectedTo = null;


/* =====================================================
   ELEMENTS
   ===================================================== */

const fromInput =
    document.getElementById("from");

const toInput =
    document.getElementById("to");

const fromSuggestions =
    document.getElementById("fromSuggestions");

const toSuggestions =
    document.getElementById("toSuggestions");

const resultBox =
    document.getElementById("result");

const button =
    document.getElementById("btn");


/* =====================================================
   STATION SEARCH
   ===================================================== */

async function searchStations(
    query,
    container,
    input,
    type
) {

    if (query.length < 2) {

        container.style.display =
            "none";

        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/stations/search?q=${encodeURIComponent(query)}`
            );


        const data =
            await response.json();


        /*
            Your backend may return the
            stations inside data.data.
        */

        const stations =
            Array.isArray(data.data)
                ? data.data
                : Array.isArray(data.data?.stations)
                    ? data.data.stations
                    : [];


        container.innerHTML = "";


        if (stations.length === 0) {

            container.style.display =
                "none";

            return;
        }


        stations.slice(0, 8).forEach(
            station => {

                const item =
                    document.createElement("div");

                item.className =
                    "suggestion";


                const stationName =
                    station.name ||
                    station.stationName ||
                    station.station_name ||
                    "Unknown Station";


                const stationCode =
                    station.code ||
                    station.stationCode ||
                    station.station_code ||
                    "";


                const city =
                    station.city ||
                    station.cityName ||
                    "";


                item.innerHTML = `

                    <div class="station-name">
                        ${escapeHTML(stationName)}
                    </div>

                    <div class="station-code">
                        ${escapeHTML(stationCode)}
                        ${city
                            ? " • " +
                              escapeHTML(city)
                            : ""
                        }
                    </div>

                `;


                item.addEventListener(
                    "click",
                    () => {


                        input.value =
                            stationName;


                        const selected = {

                            name:
                                stationName,

                            code:
                                stationCode,

                            city:
                                city

                        };


                        if (type === "from") {

                            selectedFrom =
                                selected;

                        } else {

                            selectedTo =
                                selected;
                        }


                        container.style.display =
                            "none";

                    }
                );


                container.appendChild(item);

            }
        );


        container.style.display =
            "block";


    } catch (error) {

        console.error(
            "Station search error:",
            error
        );

        container.style.display =
            "none";
    }

}


/* =====================================================
   FROM INPUT
   ===================================================== */

fromInput.addEventListener(
    "input",
    function () {

        selectedFrom = null;

        searchStations(
            this.value.trim(),
            fromSuggestions,
            fromInput,
            "from"
        );

    }
);


/* =====================================================
   TO INPUT
   ===================================================== */

toInput.addEventListener(
    "input",
    function () {

        selectedTo = null;

        searchStations(
            this.value.trim(),
            toSuggestions,
            toInput,
            "to"
        );

    }
);


/* =====================================================
   FIND ALTERNATIVE ROUTE
   ===================================================== */

async function findAlternativeRoute() {


    resultBox.style.display =
        "block";


    resultBox.innerHTML = `

        <div class="loading">
            🔎 Finding real routes...
        </div>

    `;


    button.disabled = true;


    try {


        /* ---------------------------------------------
           CHECK SELECTION
        --------------------------------------------- */

        if (!selectedFrom) {

            throw new Error(
                "Please select a From station from the suggestions."
            );
        }


        if (!selectedTo) {

            throw new Error(
                "Please select a To station from the suggestions."
            );
        }


        if (!selectedFrom.code) {

            throw new Error(
                "From station code not found."
            );
        }


        if (!selectedTo.code) {

            throw new Error(
                "To station code not found."
            );
        }


        if (
            selectedFrom.code ===
            selectedTo.code
        ) {

            throw new Error(
                "From and To stations cannot be same."
            );
        }


        /* ---------------------------------------------
           API URL
        --------------------------------------------- */

        const url =
            `${API_BASE}/api/alternative-routes` +
            `?from=${encodeURIComponent(selectedFrom.code)}` +
            `&to=${encodeURIComponent(selectedTo.code)}`;


        console.log(
            "Alternative route API:",
            url
        );


        /* ---------------------------------------------
           REQUEST
        --------------------------------------------- */

        const response =
            await fetch(url);


        const data =
            await response.json();


        console.log(
            "Alternative route response:",
            data
        );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                data.error ||
                "Unable to find route."
            );
        }


        /* ---------------------------------------------
           DISPLAY
        --------------------------------------------- */

        displayResults(data);


    } catch (error) {


        console.error(error);


        resultBox.innerHTML = `

            <div class="error">

                ❌
                ${escapeHTML(error.message)}

            </div>

        `;


    } finally {

        button.disabled = false;

    }

}


/* =====================================================
   DISPLAY RESULTS
   ===================================================== */

function displayResults(data) {


    let html = `

        <div class="result-title">
            🚆 Route Result
        </div>

        <div class="route-path">

            ${escapeHTML(selectedFrom.name)}
            (${escapeHTML(selectedFrom.code)})

            →

            ${escapeHTML(selectedTo.name)}
            (${escapeHTML(selectedTo.code)})

        </div>

    `;


    /* =================================================
       DIRECT TRAINS
    ================================================= */

    const directTrains =
        data.direct?.trains || [];


    if (
        data.direct?.available &&
        directTrains.length > 0
    ) {


        html += `

            <div class="direct-box">

                <div class="direct-title">
                    ✅ Direct trains available
                </div>

                ${directTrains
                    .slice(0, 5)
                    .map(formatTrain)
                    .join("")
                }

            </div>

        `;

    } else {


        html += `

            <div class="direct-box">

                <div class="direct-title">
                    ⚠️ No direct train found
                </div>

                <div>
                    You can try an alternative route below.
                </div>

            </div>

        `;

    }


    /* =================================================
       ALTERNATIVE ROUTES
    ================================================= */

    const alternatives =
        data.alternatives || [];


    if (alternatives.length > 0) {


        html += `

            <div class="alternative-heading">

                🔁 You can try:

            </div>

        `;


        alternatives.forEach(
            (route, index) => {


                html += `

                    <div class="alternative-card">

                        <div class="alternative-title">

                            🔁 Option ${index + 1}
                            —
                            Via ${escapeHTML(
                                route.via?.name ||
                                route.via?.code ||
                                "Interchange"
                            )}

                        </div>

                `;


                /* -------------------------------------
                   FIRST LEG
                ------------------------------------- */

                const firstTrains =
                    route.firstLeg?.trains || [];


                html += `

                    <div class="leg">

                        <div class="leg-title">

                            🚆
                            ${getName(
                                route.firstLeg?.from
                            )}

                            →

                            ${escapeHTML(
                                route.via?.name ||
                                route.via?.code ||
                                ""
                            )}

                        </div>

                `;


                if (
                    firstTrains.length > 0
                ) {

                    html +=
                        firstTrains
                            .slice(0, 3)
                            .map(formatTrain)
                            .join("");

                } else {

                    html += `
                        <div class="no-result">
                            No train found.
                        </div>
                    `;

                }


                html += `

                    </div>

                `;


                /* -------------------------------------
                   SECOND LEG
                ------------------------------------- */

                const secondTrains =
                    route.secondLeg?.trains || [];


                html += `

                    <div class="leg">

                        <div class="leg-title">

                            🚆

                            ${escapeHTML(
                                route.via?.name ||
                                route.via?.code ||
                                ""
                            )}

                            →

                            ${getName(
                                route.secondLeg?.to
                            )}

                        </div>

                `;


                if (
                    secondTrains.length > 0
                ) {

                    html +=
                        secondTrains
                            .slice(0, 3)
                            .map(formatTrain)
                            .join("");

                } else {

                    html += `
                        <div class="no-result">
                            No train found.
                        </div>
                    `;

                }


                html += `

                    </div>

                `;


                html += `

                    </div>

                `;

            }
        );


    } else {


        html += `

            <div class="no-result">

                ⚠️ No suitable alternative route
                was found.

            </div>

        `;

    }


    resultBox.innerHTML =
        html;

}


/* =====================================================
   FORMAT TRAIN
   ===================================================== */

function formatTrain(trainData) {


    const train =
        trainData.train ||
        trainData;


    const trainNumber =
        train.number ||
        train.trainNumber ||
        train.train_number ||
        "N/A";


    const trainName =
        train.name ||
        train.trainName ||
        train.train_name ||
        "Train";


    const from =
        trainData.from ||
        {};


    const to =
        trainData.to ||
        {};


    const departure =
        from.departure ||
        from.departureTime ||
        "";


    const arrival =
        to.arrival ||
        to.arrivalTime ||
        "";


    const type =
        train.type ||
        train.trainType ||
        "";


    return `

        <div class="train">

            <div class="train-main">

                <span class="train-number">
                    ${escapeHTML(
                        String(trainNumber)
                    )}
                </span>

                -

                <span class="train-name">
                    ${escapeHTML(
                        String(trainName)
                    )}
                </span>

            </div>

            <div class="train-details">

                ${
                    departure
                    ? "Departure: " +
                      escapeHTML(
                          String(departure)
                      )
                    : ""
                }

                ${
                    arrival
                    ? " | Arrival: " +
                      escapeHTML(
                          String(arrival)
                      )
                    : ""
                }

                ${
                    type
                    ? " | " +
                      escapeHTML(
                          String(type)
                      )
                    : ""
                }

            </div>

        </div>

    `;

}


/* =====================================================
   GET STATION NAME
   ===================================================== */

function getName(code) {


    if (
        selectedFrom &&
        selectedFrom.code === code
    ) {

        return escapeHTML(
            selectedFrom.name
        );

    }


    if (
        selectedTo &&
        selectedTo.code === code
    ) {

        return escapeHTML(
            selectedTo.name
        );

    }


    return escapeHTML(
        code || ""
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   CLOSE SUGGESTIONS
   ===================================================== */

document.addEventListener(
    "click",
    function (event) {

        if (
            !event.target.closest(
                ".input-group"
            )
        ) {

            fromSuggestions.style.display =
                "none";

            toSuggestions.style.display =
                "none";

        }

    }
);

</script>

</body>

</html>
