<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alternative Route | RailIntel</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #312e81,
                    #6366f1
                );

            color: white;
        }

        /* ================= NAVBAR ================= */

        nav {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px 80px;

            background: #020617;

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            position: sticky;

            top: 0;

            z-index: 1000;
        }

        .logo {

            font-size: 2.4rem;

            font-weight: 700;

            color: #b026ff;
        }

        nav ul {

            display: flex;

            list-style: none;

            gap: 32px;
        }

        nav ul li a {

            color: #94a3b8;

            text-decoration: none;

            font-size: 0.95rem;

            transition: 0.2s;
        }

        nav ul li a:hover {

            color: white;
        }

        /* ================= HEADING ================= */

        h1 {

            text-align: center;

            margin-top: 40px;

            margin-bottom: 25px;

            font-size: 1.5rem;

            font-weight: 600;
        }

        /* ================= MAIN CARD ================= */

        .box1 {

            width: 90%;

            max-width: 500px;

            margin: 0 auto 60px;

            background: #020617;

            padding: 28px 24px;

            border-radius: 14px;

            border:
                1px solid rgba(255,255,255,0.07);

            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        /* ================= INPUT AREA ================= */

        .input-group {

            position: relative;
        }

        input {

            width: 100%;

            padding: 12px 14px;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 8px;

            background: #0f172a;

            color: white;

            font-size: 0.9rem;

            outline: none;
        }

        input::placeholder {

            color: #64748b;
        }

        input:focus {

            border-color: #6366f1;
        }

        /* ================= SUGGESTIONS ================= */

        .suggestions {

            position: absolute;

            top: calc(100% + 5px);

            left: 0;

            width: 100%;

            background: #0f172a;

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 9px;

            overflow: hidden;

            z-index: 100;

            display: none;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.35);
        }

        .suggestion {

            padding: 11px 14px;

            cursor: pointer;

            border-bottom:
                1px solid rgba(255,255,255,0.05);
        }

        .suggestion:last-child {

            border-bottom: none;
        }

        .suggestion:hover {

            background: #1e293b;
        }

        .station-name {

            color: white;

            font-size: 0.9rem;

            font-weight: 500;
        }

        .station-code {

            color: #94a3b8;

            font-size: 0.75rem;

            margin-top: 2px;
        }

        /* ================= DIVIDER ================= */

        .divider {

            border: none;

            border-top:
                1px solid rgba(255,255,255,0.07);

            margin: 2px 0;
        }

        /* ================= BUTTON ================= */

        #btn {

            padding: 12px;

            border: none;

            border-radius: 10px;

            background: #6366f1;

            color: white;

            font-size: 0.92rem;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }

        #btn:hover {

            background: #4f46e5;

            transform: translateY(-1px);
        }

        #btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* ================= RESULT ================= */

        #result {

            display: none;

            background: #0f172a;

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 10px;

            padding: 16px;

            line-height: 1.7;
        }

        /* ================= ROUTE TITLE ================= */

        .route-title {

            color: #c4b5fd;

            font-size: 0.95rem;

            font-weight: 600;

            margin-bottom: 12px;
        }

        .route-path {

            color: #f8fafc;

            font-size: 0.9rem;

            margin-bottom: 15px;
        }

        /* ================= DIRECT ================= */

        .direct-box {

            padding: 13px;

            border-radius: 9px;

            background: rgba(34,197,94,0.08);

            border:
                1px solid rgba(34,197,94,0.25);

            margin-bottom: 15px;
        }

        /* ================= ALTERNATIVE ================= */

        .alternative {

            padding: 14px;

            margin-top: 12px;

            border-radius: 10px;

            background: #111827;

            border:
                1px solid rgba(255,255,255,0.08);
        }

        .alternative h3 {

            color: #facc15;

            font-size: 0.95rem;

            margin-bottom: 10px;
        }

        .leg {

            margin-top: 12px;

            padding: 11px;

            background: #0f172a;

            border-radius: 8px;

            border-left: 3px solid #6366f1;
        }

        .leg-title {

            color: #c4b5fd;

            font-size: 0.85rem;

            font-weight: 600;

            margin-bottom: 7px;
        }

        .train {

            padding: 8px 0;

            border-bottom:
                1px solid rgba(255,255,255,0.05);

            font-size: 0.82rem;
        }

        .train:last-child {

            border-bottom: none;
        }

        .train-number {

            color: #a78bfa;

            font-weight: 600;
        }

        .train-name {

            color: white;

            font-weight: 500;
        }

        .train-time {

            color: #94a3b8;

            font-size: 0.75rem;

            margin-top: 2px;
        }

        /* ================= ERROR ================= */

        .error {

            color: #fca5a5;

            background: rgba(239,68,68,0.1);

            border:
                1px solid rgba(239,68,68,0.3);

            padding: 12px;

            border-radius: 8px;
        }

        .loading {

            text-align: center;

            color: #c4b5fd;

            padding: 10px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            nav {

                padding: 14px 20px;

                flex-direction: column;

                gap: 12px;
            }

            .logo {

                font-size: 2rem;
            }

            nav ul {

                gap: 18px;

                flex-wrap: wrap;

                justify-content: center;
            }

            nav ul li a {

                font-size: 0.82rem;
            }
        }

        @media (max-width: 480px) {

            nav {

                padding: 12px 15px;
            }

            .logo {

                font-size: 1.8rem;
            }

            nav ul {

                gap: 12px;
            }

            nav ul li a {

                font-size: 0.76rem;
            }

            .box1 {

                padding: 22px 18px;
            }
        }

    </style>

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            रेल<span style="color:#94a3b8;">Intel</span>
        </div>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">FAQs</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>

        </ul>

    </nav>


    <!-- ================= TITLE ================= -->

    <h1>
        Alternative Route Finder
    </h1>


    <!-- ================= CARD ================= -->

    <div class="box1">

        <!-- FROM -->

        <div class="input-group">

            <input
                type="text"
                id="from"
                placeholder="From (e.g. Gwalior)"
                autocomplete="off"
            >

            <div
                id="fromSuggestions"
                class="suggestions"
            ></div>

        </div>


        <!-- TO -->

        <div class="input-group">

            <input
                type="text"
                id="to"
                placeholder="To (e.g. Indore)"
                autocomplete="off"
            >

            <div
                id="toSuggestions"
                class="suggestions"
            ></div>

        </div>


        <hr class="divider">


        <!-- BUTTON -->

        <button
            id="btn"
            onclick="findRoute()"
        >
            Find Route
        </button>


        <!-- RESULT -->

        <div id="result"></div>

    </div>


<script>

/* =====================================================
   BACKEND URL
   ===================================================== */

// LOCAL DEVELOPMENT
const API_BASE = "http://localhost:5000";

// WHEN DEPLOYING:
// const API_BASE = "https://railintel-project.onrender.com";


/* =====================================================
   SELECTED STATIONS
   ===================================================== */

let selectedFrom = null;
let selectedTo = null;


/* =====================================================
   ELEMENTS
   ===================================================== */

const fromInput =
    document.getElementById("from");

const toInput =
    document.getElementById("to");

const fromSuggestions =
    document.getElementById("fromSuggestions");

const toSuggestions =
    document.getElementById("toSuggestions");

const resultBox =
    document.getElementById("result");

const button =
    document.getElementById("btn");


/* =====================================================
   STATION SEARCH
   ===================================================== */

async function searchStations(
    query,
    container,
    input,
    type
) {

    if (query.length < 2) {

        container.style.display = "none";

        return;
    }

    try {

        const response = await fetch(
            `${API_BASE}/api/stations/search?q=${encodeURIComponent(query)}`
        );

        const result = await response.json();

        if (
            !result.success ||
            !Array.isArray(result.data)
        ) {

            container.style.display = "none";

            return;
        }

        container.innerHTML = "";

        result.data.forEach(station => {

            const div =
                document.createElement("div");

            div.className = "suggestion";

            div.innerHTML = `
                <div class="station-name">
                    ${station.name}
                </div>

                <div class="station-code">
                    ${station.code}
                    ${station.city ? " • " + station.city : ""}
                </div>
            `;

            div.addEventListener(
                "click",
                () => {

                    input.value =
                        station.name;

                    if (type === "from") {

                        selectedFrom = station;

                    } else {

                        selectedTo = station;
                    }

                    container.style.display =
                        "none";
                }
            );

            container.appendChild(div);
        });

        if (result.data.length > 0) {

            container.style.display =
                "block";

        } else {

            container.style.display =
                "none";
        }

    } catch (error) {

        console.error(
            "Station search error:",
            error
        );

        container.style.display =
            "none";
    }
}


/* =====================================================
   FROM INPUT
   ===================================================== */

fromInput.addEventListener(
    "input",
    function () {

        selectedFrom = null;

        searchStations(
            this.value.trim(),
            fromSuggestions,
            fromInput,
            "from"
        );
    }
);


/* =====================================================
   TO INPUT
   ===================================================== */

toInput.addEventListener(
    "input",
    function () {

        selectedTo = null;

        searchStations(
            this.value.trim(),
            toSuggestions,
            toInput,
            "to"
        );
    }
);


/* =====================================================
   FIND ROUTE
   ===================================================== */

async function findRoute() {

    resultBox.style.display = "block";

    resultBox.innerHTML = `
        <div class="loading">
            🔎 Finding real trains...
        </div>
    `;

    button.disabled = true;

    try {

        /* ---------------------------------------------
           CHECK STATIONS
        --------------------------------------------- */

        if (!selectedFrom || !selectedTo) {

            throw new Error(
                "Please select From and To stations from the suggestions."
            );
        }


        if (
            selectedFrom.code ===
            selectedTo.code
        ) {

            throw new Error(
                "From and To stations cannot be the same."
            );
        }


        /* ---------------------------------------------
           API REQUEST
        --------------------------------------------- */

        const url =
            `${API_BASE}/api/alternative-routes` +
            `?from=${encodeURIComponent(selectedFrom.code)}` +
            `&to=${encodeURIComponent(selectedTo.code)}`;

        const response =
            await fetch(url);

        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Unable to find routes."
            );
        }


        /* ---------------------------------------------
           DISPLAY
        --------------------------------------------- */

        displayRoutes(data);

    } catch (error) {

        console.error(error);

        resultBox.innerHTML = `
            <div class="error">
                ❌ ${error.message}
            </div>
        `;

    } finally {

        button.disabled = false;
    }
}


/* =====================================================
   DISPLAY ROUTES
   ===================================================== */

function displayRoutes(data) {

    let html = "";

    html += `
        <div class="route-title">
            🚆 Route Result
        </div>

        <div class="route-path">
            ${selectedFrom.name}
            (${selectedFrom.code})
            →
            ${selectedTo.name}
            (${selectedTo.code})
        </div>
    `;


    /* =================================================
       DIRECT TRAINS
    ================================================= */

    if (
        data.direct &&
        data.direct.available
    ) {

        html += `
            <div class="direct-box">

                <strong>
                    ✅ Direct trains available
                </strong>

                <br><br>

                ${data.direct.trains
                    .slice(0, 5)
                    .map(formatTrain)
                    .join("")
                }

            </div>
        `;

    } else {

        html += `
            <div class="direct-box">

                ⚠️ No direct train found.

            </div>
        `;
    }


    /* =================================================
       ALTERNATIVE ROUTES
    ================================================= */

    if (
        data.alternatives &&
        data.alternatives.length > 0
    ) {

        html += `
            <div
                style="
                    margin-top:12px;
                    color:#facc15;
                    font-weight:600;
                "
            >
                🔁 You can try these alternative routes:
            </div>
        `;


        data.alternatives.forEach(
            (alternative, index) => {

                html += `
                    <div class="alternative">

                        <h3>
                            🔁 Option ${index + 1}:
                            Via ${alternative.via.name}
                        </h3>
                `;


                /* FIRST LEG */

                html += `
                    <div class="leg">

                        <div class="leg-title">
                            🚆
                            ${getStationName(
                                alternative.firstLeg.from
                            )}
                            →
                            ${alternative.via.name}
                        </div>

                        ${alternative.firstLeg.trains
                            .slice(0, 3)
                            .map(formatTrain)
                            .join("")
                        }

                    </div>
                `;


                /* SECOND LEG */

                html += `
                    <div class="leg">

                        <div class="leg-title">
                            🚆
                            ${alternative.via.name}
                            →
                            ${getStationName(
                                alternative.secondLeg.to
                            )}
                        </div>

                        ${alternative.secondLeg.trains
                            .slice(0, 3)
                            .map(formatTrain)
                            .join("")
                        }

                    </div>
                `;


                html += `
                    </div>
                `;
            }
        );

    } else {

        html += `
            <div
                style="
                    margin-top:12px;
                    color:#facc15;
                "
            >
                ⚠️ No suitable alternative route
                was found.
            </div>
        `;
    }


    resultBox.innerHTML = html;
}


/* =====================================================
   FORMAT TRAIN
   ===================================================== */

function formatTrain(trainData) {

    const train =
        trainData.train || {};

    const from =
        trainData.from || {};

    const to =
        trainData.to || {};

    return `
        <div class="train">

            <div>

                <span class="train-number">
                    ${train.number || "N/A"}
                </span>

                -

                <span class="train-name">
                    ${train.name || "Train"}
                </span>

            </div>

            <div class="train-time">

                ${from.departure
                    ? `Departure: ${from.departure}`
                    : ""
                }

                ${to.arrival
                    ? ` | Arrival: ${to.arrival}`
                    : ""
                }

                ${
                    train.type
                    ? ` | ${train.type}`
                    : ""
                }

            </div>

        </div>
    `;
}


/* =====================================================
   STATION NAME
   ===================================================== */

function getStationName(code) {

    if (
        selectedFrom &&
        selectedFrom.code === code
    ) {

        return selectedFrom.name;
    }

    if (
        selectedTo &&
        selectedTo.code === code
    ) {

        return selectedTo.name;
    }

    return code;
}


/* =====================================================
   CLOSE SUGGESTIONS
   ===================================================== */

document.addEventListener(
    "click",
    function (event) {

        if (
            !event.target.closest(".input-group")
        ) {

            fromSuggestions.style.display =
                "none";

            toSuggestions.style.display =
                "none";
        }
    }
);

</script>

</body>

</html>
