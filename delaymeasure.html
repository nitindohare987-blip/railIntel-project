    <style>

<body>
    <nav>
        <div class="logo">रेल<span style="color:#94a3b8;">Intel</span></div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#faqs">FAQs</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <h2>Delay Intelligence</h2>

    <div class="div">
        <input
            type="text"
            id="train"
            placeholder="Train Number (e.g. 12919)"
            inputmode="numeric"
            maxlength="6"
            autocomplete="off"
        >

        <select id="type">
            <option value="Superfast">Superfast</option>
            <option value="Express">Express</option>
            <option value="Passenger">Passenger</option>
            <option value="Local">Local</option>
            <option value="Vande Bharat">Vande Bharat</option>
        </select>

        <hr class="divider">

        <button id="checkBtn" type="button" onclick="checkRecovery()">
            Check Recovery
        </button>

        <div id="message" role="status" aria-live="polite"></div>
        <div id="result"></div>

        <section id="chartSection">
            <h3 class="chart-title">Recorded Delay History</h3>
            <div class="chart-wrap">
                <canvas id="delayChart"></canvas>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = "https://railintel-project.onrender.com";

        let chart = null;

        const trainInput = document.getElementById("train");
        const resultBox = document.getElementById("result");
        const messageBox = document.getElementById("message");
        const checkBtn = document.getElementById("checkBtn");
        const chartSection = document.getElementById("chartSection");

        function showMessage(message) {
            messageBox.textContent = message;
        }

        function showError(message) {
            resultBox.style.display = "block";
            resultBox.textContent = message;
        }

        function addRow(container, label, value) {
            const row = document.createElement("div");
            row.className = "result-row";

            const left = document.createElement("span");
            left.className = "muted";
            left.textContent = label;

            const right = document.createElement("strong");
            right.textContent = value;

            row.append(left, right);
            container.appendChild(row);
        }

        function formatDate(value) {
            if (!value) return "Not available";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return String(value);
            }

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                timeZone: "Asia/Kolkata"
            });
        }

        function getDelay(record) {
            const value = Number(record?.delayMinutes);
            return Number.isFinite(value) ? value : null;
        }

        function getRisk(delay) {
            if (delay <= 10) {
                return "Low";
            }

            if (delay <= 60) {
                return "Medium";
            }

            return "High";
        }

        async function fetchJSON(url) {
            const response = await fetch(url);

            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error("Server returned an invalid response.");
            }

            if (!response.ok || data?.success === false) {
                throw new Error(
                    data?.message ||
                    data?.error?.message ||
                    `Request failed (${response.status}).`
                );
            }

            return data;
        }

        async function checkRecovery() {
            const trainNumber = trainInput.value.trim();
            const trainType = document.getElementById("type").value;

            if (!/^\d{4,6}$/.test(trainNumber)) {
                resultBox.style.display = "block";
                showError("Please enter a valid 4–6 digit train number.");
                showMessage("");
                return;
            }

            checkBtn.disabled = true;
            checkBtn.textContent = "Checking...";
            resultBox.style.display = "none";
            resultBox.replaceChildren();
            chartSection.style.display = "none";
            showMessage("Fetching live train information...");

            if (chart) {
                chart.destroy();
                chart = null;
            }

            try {
                /*
                 * Collect a live snapshot using the existing backend route.
                 * This stores/updates a record in MongoDB if collection succeeds.
                 */
                let snapshot = null;
                let collectionWarning = "";

                try {
                    const collected = await fetchJSON(
                        `${API_BASE}/api/reliability/collect/${encodeURIComponent(trainNumber)}`
                    );

                    snapshot = collected?.data || null;
                } catch (error) {
                    collectionWarning =
                        "Could not save a new live snapshot: " + error.message;
                }

                showMessage("Loading recorded delay history...");

                const historyResponse = await fetchJSON(
                    `${API_BASE}/api/reliability/history/${encodeURIComponent(trainNumber)}`
                );

                const history = Array.isArray(historyResponse?.data)
                    ? historyResponse.data
                    : [];

                /*
                 * Prefer the freshly collected snapshot. If collection was
                 * unavailable, use the newest stored record when present.
                 */
                const latest = snapshot ||
                    (history.length ? history[0] : null);

                resultBox.replaceChildren();
                resultBox.style.display = "block";

                const heading = document.createElement("h3");
                heading.textContent = latest?.trainName ||
                    `Train ${trainNumber}`;
                heading.style.marginBottom = "10px";
                resultBox.appendChild(heading);

                addRow(resultBox, "Train Number", trainNumber);
                addRow(resultBox, "Train Type", trainType);

                if (latest) {
                    const delay = getDelay(latest);

                    addRow(
                        resultBox,
                        "Latest Recorded Delay",
                        delay === null ? "Not available" : `${delay} minutes`
                    );

                    addRow(
                        resultBox,
                        "Current Status",
                        latest.status || "Not available"
                    );

                    addRow(
                        resultBox,
                        "Current Station",
                        latest.currentStation || "Not available"
                    );

                    addRow(
                        resultBox,
                        "Next Station",
                        latest.nextStation || "Not available"
                    );

                    addRow(
                        resultBox,
                        "Journey Date",
                        formatDate(latest.journeyDate || latest.startDate)
                    );

                    if (delay !== null) {
                        addRow(resultBox, "Delay Risk", getRisk(delay));
                    }
                } else {
                    addRow(resultBox, "Latest Delay", "Not available");
                }

                addRow(
                    resultBox,
                    "Saved History Records",
                    String(history.length)
                );

                const note = document.createElement("p");
                note.className = "muted";
                note.style.marginTop = "12px";
                note.style.fontSize = ".8rem";
                note.textContent =
                    "Risk is a simple delay-threshold indicator, not a prediction of recovery or an official railway rating.";
                resultBox.appendChild(note);

                if (collectionWarning) {
                    showMessage(
                        collectionWarning +
                        " Showing saved history where available."
                    );
                } else {
                    showMessage("Live snapshot request completed.");
                }

                renderHistoryChart(history);

                if (history.length === 0) {
                    showMessage(
                        (collectionWarning ? collectionWarning + " " : "") +
                        "No historical records are saved yet. The chart will appear as records accumulate."
                    );
                }
            } catch (error) {
                showMessage("");
                showError(
                    "Unable to load delay intelligence. " +
                    error.message +
                    " Please try again later."
                );
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = "Check Recovery";
            }
        }

        function renderHistoryChart(history) {
            const validRecords = history
                .filter(record => getDelay(record) !== null)
                .slice()
                .reverse();

            if (validRecords.length === 0) {
                chartSection.style.display = "none";
                return;
            }

            chartSection.style.display = "block";

            const labels = validRecords.map(record =>
                formatDate(record.journeyDate || record.capturedAt)
            );

            const delays = validRecords.map(record => getDelay(record));

            const ctx = document.getElementById("delayChart")
                .getContext("2d");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        label: "Recorded Delay (minutes)",
                        data: delays,
                        borderColor: "#818cf8",
                        backgroundColor: "rgba(99,102,241,0.12)",
                        borderWidth: 2,
                        pointBackgroundColor: "#818cf8",
                        pointRadius: 4,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: "#cbd5e1"
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: "rgba(255,255,255,0.05)"
                            },
                            ticks: {
                                color: "#94a3b8",
                                maxRotation: 45,
                                minRotation: 0
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: "Delay (minutes)",
                                color: "#94a3b8"
                            },
                            grid: {
                                color: "rgba(255,255,255,0.05)"
                            },
                            ticks: {
                                color: "#94a3b8"
                            }
                        }
                    }
                }
            });
        }

        trainInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                checkRecovery();
            }
        });
    </script>
</body>
</html>
