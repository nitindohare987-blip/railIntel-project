<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passenger Rating – RailIntel</title>


<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">


<style>

/* ================= GLOBAL ================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    font-family: 'Poppins', sans-serif;

    text-decoration: none;

}


body {

    background: linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #312e81,
        #6366f1
    );

    color: white;

    min-height: 100vh;

}


/* ================= NAVBAR ================= */

nav {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 80px;

    background: #020617;

    border-bottom: 1px solid rgba(255, 255, 255, 0.07);

    position: sticky;

    top: 0;

    z-index: 1000;

}


.logo {

    font-size: 2.4rem;

    font-weight: 700;

    color: #b026ff;

}


nav ul {

    display: flex;

    list-style: none;

    gap: 32px;

}


nav ul li a {

    color: #94a3b8;

    font-size: 0.95rem;

    transition: color 0.2s;

    position: relative;

}


nav ul li a:hover {

    color: white;

}


/* underline */

nav ul li a::after {

    content: '';

    position: absolute;

    bottom: -3px;

    left: 0;

    width: 0;

    height: 1px;

    background: #b026ff;

    transition: width 0.25s;

}


nav ul li a:hover::after {

    width: 100%;

}


/* ================= PAGE TITLE ================= */

h2 {

    text-align: center;

    padding-top: 40px;

    font-size: 1.4rem;

    font-weight: 600;

    color: #e2e8f0;

    letter-spacing: 0.2px;

}


/* ================= MAIN BOX ================= */

.box1 {

    width: 370px;

    margin: 32px auto 60px;

    background: rgba(2, 6, 23, 0.72);

    backdrop-filter: blur(14px);

    padding: 32px 28px;

    border-radius: 16px;

    border: 1px solid rgba(255,255,255,0.09);

    display: flex;

    flex-direction: column;

    gap: 12px;

    box-shadow: 0 8px 40px rgba(0,0,0,0.45);

}


/* ================= LABELS ================= */

label {

    font-size: 0.78rem;

    color: #94a3b8;

    margin-bottom: -4px;

    text-transform: uppercase;

    letter-spacing: 0.6px;

}


/* ================= INPUTS ================= */

input,
select,
textarea {

    padding: 11px 14px;

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 9px;

    background: rgba(15, 23, 42, 0.85);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 0.9rem;

    outline: none;

    transition: border-color 0.25s;

    width: 100%;

}


input::placeholder,
textarea::placeholder {

    color: #475569;

}


input:focus,
select:focus,
textarea:focus {

    border-color: #2563eb;

    background: rgba(15, 23, 42, 1);

}


textarea {

    min-height: 90px;

    resize: vertical;

}


/* ================= SELECT OPTIONS ================= */

select option {

    background: #0f172a;

    color: white;

}


/* ================= DIVIDER ================= */

.divider {

    border: none;

    border-top: 1px solid rgba(255,255,255,0.07);

    margin: 8px 0;

}


/* ================= BUTTON ================= */

button {

    margin-top: 8px;

    padding: 11px 32px;

    border: none;

    border-radius: 25px;

    background: #2563eb;

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 0.92rem;

    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.25s,
        transform 0.15s,
        box-shadow 0.25s;

    width: 100%;

    box-shadow:
        0 4px 14px rgba(37,99,235,0.4);

}


button:hover {

    background: #1d4ed8;

    transform: translateY(-1px);

    box-shadow:
        0 6px 20px rgba(37,99,235,0.55);

}


button:active {

    transform: translateY(0);

}


button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

    transform: none;

}


/* ================= RESULT ================= */

#result {

    margin-top: 20px;

    font-size: 0.92rem;

    line-height: 1.8;

    color: #ffd166;

    width: 100%;

    text-align: center;

}


/* ================= RESULT CARD ================= */

.result-card {

    background: rgba(15, 23, 42, 0.9);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 12px;

    padding: 16px;

    text-align: left;

}


.result-success {

    color: #86efac;

    font-weight: 600;

    margin-bottom: 8px;

}


.result-error {

    color: #fca5a5;

    background: rgba(127,29,29,0.25);

    border: 1px solid rgba(248,113,113,0.25);

    border-radius: 10px;

    padding: 12px;

}


.rating-main {

    text-align: center;

    font-size: 1.5rem;

    font-weight: 700;

    color: #fde68a;

    margin: 8px 0 15px;

}


.rating-stats {

    border-top: 1px solid rgba(255,255,255,0.07);

    padding-top: 12px;

}


.rating-row {

    display: flex;

    justify-content: space-between;

    padding: 5px 0;

    color: #cbd5e1;

    font-size: 0.85rem;

}


.rating-row span:last-child {

    color: #e2e8f0;

    font-weight: 600;

}


/* ================= RESPONSIVE ================= */

@media (max-width: 600px) {

    nav {

        padding: 14px 20px;

    }


    .logo {

        font-size: 1.8rem;

    }


    nav ul {

        gap: 16px;

    }


    nav ul li a {

        font-size: 0.8rem;

    }


    .box1 {

        width: 90%;

        max-width: 370px;

        margin-top: 25px;

        padding: 28px 22px;

    }


    h2 {

        padding-top: 30px;

    }

}

</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">

        रेल<span style="color:#94a3b8;">Intel</span>

    </div>


    <ul>

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="#">About</a>
        </li>

        <li>
            <a href="#">FAQs</a>
        </li>

        <li>
            <a href="#">Contact</a>
        </li>

    </ul>

</nav>


<!-- ================= TITLE ================= -->

<h2>

    Passenger Rating

</h2>


<!-- ================= RATING BOX ================= -->

<div class="box1">


    <!-- TRAIN NUMBER -->

    <label for="train">

        Train Number

    </label>


    <input
        type="text"
        id="train"
        placeholder="Enter train number"
        maxlength="5"
    >


    <hr class="divider">


    <!-- COMFORT -->

    <label for="comfort">

        Comfort (1–5)

    </label>


    <select id="comfort">

        <option value="">

            Select Rating

        </option>

        <option value="1">

            1 - Poor

        </option>

        <option value="2">

            2 - Below Average

        </option>

        <option value="3">

            3 - Average

        </option>

        <option value="4">

            4 - Good

        </option>

        <option value="5">

            5 - Excellent

        </option>

    </select>


    <!-- FOOD -->

    <label for="food">

        Food (1–5)

    </label>


    <select id="food">

        <option value="">

            Select Rating

        </option>

        <option value="1">

            1 - Poor

        </option>

        <option value="2">

            2 - Below Average

        </option>

        <option value="3">

            3 - Average

        </option>

        <option value="4">

            4 - Good

        </option>

        <option value="5">

            5 - Excellent

        </option>

    </select>


    <!-- STAFF -->

    <label for="staff">

        Staff (1–5)

    </label>


    <select id="staff">

        <option value="">

            Select Rating

        </option>

        <option value="1">

            1 - Poor

        </option>

        <option value="2">

            2 - Below Average

        </option>

        <option value="3">

            3 - Average

        </option>

        <option value="4">

            4 - Good

        </option>

        <option value="5">

            5 - Excellent

        </option>

    </select>


    <!-- DELAY -->

    <label for="delay">

        Delay Experience (1–5)

    </label>


    <select id="delay">

        <option value="">

            Select Rating

        </option>

        <option value="1">

            1 - Very Bad

        </option>

        <option value="2">

            2 - Bad

        </option>

        <option value="3">

            3 - Average

        </option>

        <option value="4">

            4 - Good

        </option>

        <option value="5">

            5 - Excellent

        </option>

    </select>


    <!-- COMMENT -->

    <label for="other">

        Other Comments

    </label>


    <textarea
        id="other"
        placeholder="Share your experience..."
    ></textarea>


    <!-- BUTTON -->

    <button
        id="submitBtn"
        onclick="submitFeedback()"
    >

        Submit Feedback

    </button>


    <!-- RESULT -->

    <div id="result"></div>


</div>


<!-- ================= JAVASCRIPT ================= -->

<script>


/*
=========================================================
API BASE
=========================================================

LOCAL TEST:

http://localhost:5000

LIVE:

https://railintel-project.onrender.com

Abhi local testing ke liye localhost rakha hai.
=========================================================
*/


const API_BASE =
    "http://localhost:5000";



/*
=========================================================
SUBMIT FEEDBACK
=========================================================
*/


async function submitFeedback() {


    const train =
        document
            .getElementById("train")
            .value
            .trim();


    const comfort =
        document
            .getElementById("comfort")
            .value;


    const food =
        document
            .getElementById("food")
            .value;


    const staff =
        document
            .getElementById("staff")
            .value;


    const delay =
        document
            .getElementById("delay")
            .value;


    const other =
        document
            .getElementById("other")
            .value
            .trim();


    const result =
        document.getElementById("result");


    const button =
        document.getElementById("submitBtn");



    /* ================= VALIDATION ================= */


    if (!train) {

        result.innerHTML = `

            <div class="result-error">

                ❌ Please enter train number.

            </div>

        `;

        return;

    }



    if (!/^\d+$/.test(train)) {

        result.innerHTML = `

            <div class="result-error">

                ❌ Train number should contain only numbers.

            </div>

        `;

        return;

    }



    if (
        !comfort ||
        !food ||
        !staff ||
        !delay
    ) {

        result.innerHTML = `

            <div class="result-error">

                ❌ Please rate all four categories.

            </div>

        `;

        return;

    }



    /* ================= BUTTON LOADING ================= */


    button.disabled = true;

    button.innerText =
        "Submitting...";



    try {


        /* ================= POST RATING ================= */


        const response =
            await fetch(
                `${API_BASE}/api/ratings`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        trainNumber:
                            train,

                        comfort:
                            Number(comfort),

                        food:
                            Number(food),

                        staff:
                            Number(staff),

                        delay:
                            Number(delay),

                        other:
                            other

                    })

                }
            );



        const data =
            await response.json();



        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.message ||
                "Unable to submit feedback."

            );

        }



        /* ================= GET TRAIN SUMMARY ================= */


        const summaryResponse =
            await fetch(

                `${API_BASE}/api/ratings/${encodeURIComponent(train)}`

            );


        const summary =
            await summaryResponse.json();



        /* ================= SUMMARY VALUES ================= */


        const average =
            Number(
                summary.averageRating || 0
            ).toFixed(1);


        const categories =
            summary.categoryAverages || {};



        /* ================= SHOW RESULT ================= */


        result.innerHTML = `

            <div class="result-card">

                <div class="result-success">

                    ✓ Feedback Submitted Successfully

                </div>


                <div style="
                    color:#94a3b8;
                    font-size:0.82rem;
                    text-align:center;
                ">

                    Train ${train}

                </div>


                <div class="rating-main">

                    ⭐ ${Number(
                        data.overallRating
                    ).toFixed(1)} / 5

                </div>


                <div class="rating-stats">


                    <div class="rating-row">

                        <span>
                            Total Ratings
                        </span>

                        <span>
                            ${summary.totalRatings}
                        </span>

                    </div>


                    <div class="rating-row">

                        <span>
                            Train Average
                        </span>

                        <span>
                            ⭐ ${average} / 5
                        </span>

                    </div>


                    <div class="rating-row">

                        <span>
                            Comfort
                        </span>

                        <span>
                            ${Number(
                                categories.comfort || 0
                            ).toFixed(1)} / 5
                        </span>

                    </div>


                    <div class="rating-row">

                        <span>
                            Food
                        </span>

                        <span>
                            ${Number(
                                categories.food || 0
                            ).toFixed(1)} / 5
                        </span>

                    </div>


                    <div class="rating-row">

                        <span>
                            Staff
                        </span>

                        <span>
                            ${Number(
                                categories.staff || 0
                            ).toFixed(1)} / 5
                        </span>

                    </div>


                    <div class="rating-row">

                        <span>
                            Delay Experience
                        </span>

                        <span>
                            ${Number(
                                categories.delay || 0
                            ).toFixed(1)} / 5
                        </span>

                    </div>


                </div>

            </div>

        `;



        /* ================= CLEAR FORM ================= */


        document.getElementById("train").value =
            "";

        document.getElementById("comfort").value =
            "";

        document.getElementById("food").value =
            "";

        document.getElementById("staff").value =
            "";

        document.getElementById("delay").value =
            "";

        document.getElementById("other").value =
            "";


    }


    catch (error) {


        console.error(
            "Rating Error:",
            error
        );


        result.innerHTML = `

            <div class="result-error">

                ❌ ${error.message}

            </div>

        `;

    }


    finally {

        button.disabled = false;

        button.innerText =
            "Submit Feedback";

    }

}

</script>


</body>

</html>
