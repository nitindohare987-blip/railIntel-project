<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reliability Indicator – RailIntel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #0f172a, #1e293b, #312e81, #6366f1);
  color: white;
  min-height: 100vh;
}

/* ── NAVBAR ── */

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 80px;
  background: #020617;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  position: sticky;
  top: 0;
  z-index: 1000;
  
}

.logo {
  font-size: 2.4rem;
  font-weight: 700;
  color: #b026ff;
}

nav ul {
  display: flex;
  list-style: none;
  gap: 32px;
  
}

nav ul li a {
  color: #94a3b8;
  font-size: 0.95rem;
  transition: color 0.2s;
  position: relative;
}

nav ul li a:hover {
  color: white;
  text-decoration: none;
}

/* underline effect on hover */

nav ul li a::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 0;
  width: 0;
  height: 1px;
  background: #b026ff;
  transition: width 0.25s;
}

nav ul li a:hover::after {
  width: 100%;
}

/* PAGE TITLE */

h2 {
  text-align: center;
  margin-top: 36px;
  font-size: 1.4rem;
  font-weight: 600;
  color: #e2e8f0;
  letter-spacing: 0.2px;
}

/* CARD */

.box1 {
  width: 370px;
  margin: 32px auto 60px;
  background: rgba(2, 6, 23, 0.72);
  backdrop-filter: blur(14px);
  padding: 32px 28px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.09);
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.45);
}

/* LABELS */

label {
  font-size: 0.78rem;
  color: #94a3b8;
  margin-bottom: -4px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* INPUTS */

input, select {
  padding: 11px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 9px;
  background: rgba(15, 23, 42, 0.85);
  color: white;
  font-family: 'Poppins', sans-serif;
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.25s;
  width: 100%;
}

input::placeholder {
  color: #475569;
}

input:focus, select:focus {
  border-color: #6366f1;
  background: rgba(15, 23, 42, 1);
}

select option {
  background: #0f172a;
}

/* BUTTON */

button {
  padding: 12px;
  background: #6366f1;
  border: none;
  border-radius: 10px;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
  box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  width: 100%;
}

button:hover {
  background: #4f46e5;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(99,102,241,0.5);
}

button:active {
  transform: translateY(0);
}

/* DIVIDER */

hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.07);
}

/* RESULT */

#result {
  margin-top: 4px;
  text-align: center;
  font-size: 1.1rem;
  font-weight: 700;
  min-height: 28px;
  transition: all 0.3s;
}

.high {
  color: #4ade80;
}

.medium {
  color: #fb923c;
}

.low {
  color: #f87171;
}

/* SCORE BAR */

#bar-wrap {
  display: none;
  flex-direction: column;
  gap: 6px;
}

#bar-wrap span {
  font-size: 0.75rem;
  color: #94a3b8;
  text-align: right;
}

#bar-bg {
  width: 100%;
  height: 7px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  overflow: hidden;
}

#bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  transition: width 0.7s cubic-bezier(.4,0,.2,1), background 0.4s;
}

/* ================= MOBILE RESPONSIVE ================= */

@media (max-width: 768px) {

  nav {
    padding: 14px 20px;
    flex-direction: column;
    gap: 12px;
  }

  .logo {
    font-size: 2rem;
  }

  nav ul {
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  nav ul li a {
    font-size: 0.82rem;
  }

}

/* ================= SMALL MOBILE ================= */

@media (max-width: 480px) {

  nav {
    padding: 12px 15px;
  }

  .logo {
    font-size: 1.8rem;
  }

  nav ul {
    gap: 12px;
  }

  nav ul li a {
    font-size: 0.76rem;
  }

}

</style>

</head>


<body>


<!-- NAV -->

<nav>

  <div class="logo">
    रेल<span style="color:#94a3b8;">Intel</span>
  </div>

  <ul>

    <li><a href="index.html">home</a></li>
  
    <li><a href="about.html">About</a></li>

    <li><a href="faqs.html">FAQs</a></li>

    <li><a href="lintact.html">Contact</a></li>

  </ul>

</nav>


<!-- TITLE -->

<h2>Smart Reliability Analyzer</h2>


<!-- CARD -->

<div class="box1">

  <input
    type="text"
    id="trainno"
    placeholder="Train Number"
    maxlength="5"
  >

  <hr>

  <button onclick="check()">
    Check Reliability
  </button>


  <!-- RESULT -->

  <div id="result"></div>


  <!-- SCORE BAR -->

  <div id="bar-wrap">

    <span id="bar-label">0%</span>

    <div id="bar-bg">

      <div id="bar-fill"></div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   RELIABILITY CHECK
===================================================== */

async function check() {

  const trainNumber =
    document.getElementById("trainno").value.trim();

  const result =
    document.getElementById("result");

  const barWrap =
    document.getElementById("bar-wrap");

  const barFill =
    document.getElementById("bar-fill");

  const barLabel =
    document.getElementById("bar-label");


  /* =====================================================
     VALIDATION
  ===================================================== */

  if (!trainNumber) {

    result.innerHTML =
      `<span class="low">⚠️ Please enter train number</span>`;

    barWrap.style.display = "none";

    return;
  }


  if (!/^\d+$/.test(trainNumber)) {

    result.innerHTML =
      `<span class="low">⚠️ Train number must contain digits only</span>`;

    barWrap.style.display = "none";

    return;
  }


  /* =====================================================
     LOADING
  ===================================================== */

  result.innerHTML =
    `<span class="medium">⏳ Analyzing real train reliability...</span>`;

  barWrap.style.display = "none";


  try {

    /* =====================================================
       CALL RAILINTEL BACKEND
    ===================================================== */

    const response = await fetch(

      `https://railintel-project.onrender.com/api/reliability/${encodeURIComponent(trainNumber)}`

    );


    const data = await response.json();


    console.log(
      "Reliability API Response:",
      data
    );


    /* =====================================================
       API ERROR
    ===================================================== */

    if (!response.ok || data.success === false) {

      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.message ||
        "Unable to analyze train.";

      result.innerHTML =
        `<span class="low">❌ ${errorMessage}</span>`;

      barWrap.style.display = "none";

      return;
    }


    /* =====================================================
       GET DATA
    ===================================================== */

    const trainData =
      data?.data || {};


    const trainName =
      trainData?.trainName ||
      "Train";


    const trainNumberResult =
      trainData?.trainNumber ||
      trainNumber;


    const currentDelay =
      Number(trainData?.currentDelay || 0);


    const averageDelay =
      trainData?.averageDelay;


    const medianDelay =
      trainData?.medianDelay;


    const lowDelayDays =
      trainData?.lowDelayDays;


    const lowDelayPercentage =
      trainData?.lowDelayPercentage;


    const majorDelayDays =
      trainData?.majorDelayDays;


    const majorDelayPercentage =
      trainData?.majorDelayPercentage;


    const score =
      trainData?.reliabilityScore;


    const reliabilityStatus =
      trainData?.reliabilityStatus ||
      "Unknown";


    const currentStation =
      trainData?.currentStation ||
      "-";


    const nextStation =
      trainData?.nextStation ||
      "-";


    const currentComparison =
      trainData?.currentComparison ||
      "";


    const historicalAvailable =
      trainData?.historicalDataAvailable === true;


    const totalRecords =
      Number(trainData?.totalRecords || 0);


    /* =====================================================
       NOT ENOUGH HISTORICAL DATA
    ===================================================== */

    if (
      !historicalAvailable ||
      score === null ||
      score === undefined
    ) {

      result.innerHTML = `

        <span class="medium">

          🚆 ${trainName}
          (${trainNumberResult})

          <br><br>

          📊 Reliability Analysis

          <br><br>

          ⚠️ ${trainData?.message ||
          "Not enough historical data yet."}

          <br><br>

          📚 Historical Records:
          ${totalRecords}

          <br><br>

          ⏱️ Current Delay:
          ${currentDelay} minutes

          <br>

          📡 Current Status:
          ${trainData?.status || "Unknown"}

          <br><br>

          📍 Current Station:
          ${currentStation}

          <br>

          🎯 Next Station:
          ${nextStation}

        </span>

      `;

      barWrap.style.display = "none";

      return;
    }


    /* =====================================================
       STATUS CLASS
    ===================================================== */

    let statusClass = "medium";

    let barColor = "#fb923c";


    if (score >= 75) {

      statusClass = "high";

      barColor = "#4ade80";

    }

    else if (score >= 50) {

      statusClass = "medium";

      barColor = "#fb923c";

    }

    else {

      statusClass = "low";

      barColor = "#f87171";

    }


    /* =====================================================
       DAY-WISE PATTERN
    ===================================================== */

    const dayWisePattern =
      trainData?.dayWisePattern || {};


    const dayOrder = [

      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"

    ];


    let dayPatternHTML = "";


    dayOrder.forEach(day => {

      if (
        dayWisePattern[day] !== undefined
      ) {

        dayPatternHTML +=
          `${day.slice(0, 3)}: ${dayWisePattern[day]} min<br>`;

      }

    });


    if (!dayPatternHTML) {

      dayPatternHTML =
        "Not enough day-wise data yet.";

    }


    /* =====================================================
       CURRENT COMPARISON
    ===================================================== */

    let comparisonClass = "medium";


    if (
      currentDelay >
      Number(averageDelay) + 15
    ) {

      comparisonClass = "low";

    }

    else if (
      currentDelay <
      Number(averageDelay) - 15
    ) {

      comparisonClass = "high";

    }


    /* =====================================================
       DISPLAY RESULT
    ===================================================== */

    result.innerHTML = `

      <span class="${statusClass}">

        🚆 ${trainName}
        (${trainNumberResult})

        <br><br>

        📊 Reliability Score:
        ${score}/100

        <br>

        ${reliabilityStatus}

        <br><br>

        📈 Delay Analysis

        <br><br>

        ⏱️ Average Delay:
        ${averageDelay} minutes

        <br>

        📌 Median Delay:
        ${medianDelay} minutes

        <br>

        🟢 Low-delay Days:
        ${lowDelayPercentage}%
        (${lowDelayDays} days)

        <br>

        🔴 Major Delay Days:
        ${majorDelayDays}
        (${majorDelayPercentage}%)

        <br><br>

        📅 Day-wise Pattern

        <br>

        ${dayPatternHTML}

        <br>

        📡 TODAY

        <br>

        Current Delay:
        ${currentDelay} minutes

        <br>

        <span class="${comparisonClass}">
          ${currentComparison}
        </span>

        <br><br>

        📍 Current Station:
        ${currentStation}

        <br>

        🎯 Next Station:
        ${nextStation}

      </span>

    `;


    /* =====================================================
       SCORE BAR
    ===================================================== */

    barWrap.style.display =
      "flex";


    barLabel.textContent =
      score + "/100";


    barFill.style.background =
      barColor;


    barFill.style.width =
      "0%";


    setTimeout(() => {

      barFill.style.width =
        score + "%";

    }, 50);

  }


  catch (error) {

    console.error(
      "Reliability Error:",
      error
    );


    result.innerHTML =
      `<span class="low">❌ Unable to connect to railway server.</span>`;

    barWrap.style.display =
      "none";

  }

}

</script>


</body>

</html>
