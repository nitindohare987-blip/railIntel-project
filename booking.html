<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Ticket | RailIntel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  text-decoration: none;
}

html {
  scroll-behavior: smooth;
}

body {
  background: linear-gradient(135deg, #0f172a, #1e293b, #312e81, #6366f1);
  color: white;
  min-height: 100vh;
}

/* ================= NAVBAR ================= */

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 80px;
  background: #020617;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  font-size: 2.4rem;
  font-weight: 700;
  color: #b026ff;
}

nav ul {
  display: flex;
  list-style: none;
  gap: 32px;
}

nav ul li a {
  color: #94a3b8;
  font-size: 0.95rem;
  transition: all 0.2s;
  position: relative;
}

nav ul li a:hover {
  color: white;
}

nav ul li a::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 0;
  width: 0;
  height: 1px;
  background: #b026ff;
  transition: width 0.25s;
}

nav ul li a:hover::after {
  width: 100%;
}

/* ================= HEADING ================= */

h2 {
  text-align: center;
  font-size: 1.4rem;
  font-weight: 600;
  padding: 32px 0 4px;
  letter-spacing: 0.5px;
  color: #e2e8f0;
}

/* ================= FORM BOX ================= */

.formBox {
  width: 90%;
  max-width: 500px;
  margin: 20px auto 60px;
  background: #020617;
  border: 1px solid rgba(255,255,255,0.07);
  padding: 28px 24px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ================= INPUTS ================= */

input,
select {
  padding: 11px 14px;
  width: 100%;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: #0f172a;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.2s;
}

input::placeholder {
  color: #475569;
}

input:focus,
select:focus {
  border-color: #6366f1;
}

select option {
  background: #0f172a;
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(0.6);
  cursor: pointer;
}

/* ================= STATION SUGGESTIONS ================= */

.station-wrapper {
  position: relative;
}

.station-results {
  position: absolute;
  left: 0;
  right: 0;
  top: 48px;
  background: #0f172a;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  z-index: 2000;
  max-height: 220px;
  overflow-y: auto;
  display: none;
}

.station-item {
  padding: 10px 12px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.station-item:hover {
  background: #1e293b;
}

.station-name {
  color: #e2e8f0;
  font-size: 0.85rem;
}

.station-code {
  color: #94a3b8;
  font-size: 0.72rem;
}

/* ================= DIVIDER ================= */

.divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.07);
  margin: 2px 0;
}

/* ================= BUTTONS ================= */

.btn-row {
  display: flex;
  gap: 10px;
}

.btn-book {
  flex: 1;
  padding: 11px;
  border: none;
  border-radius: 20px;
  background: #6366f1;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}

.btn-book:hover {
  background: #4f46e5;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(99,102,241,0.35);
}

.btn-back {
  padding: 11px 20px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  background: transparent;
  color: #94a3b8;
  font-family: 'Poppins', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.25s;
}

.btn-back:hover {
  border-color: white;
  color: white;
}

/* ================= STATUS ================= */

#status {
  text-align: center;
  font-size: 0.85rem;
  color: #94a3b8;
  display: none;
}

/* ================= TRAIN RESULTS ================= */

#trainResults {
  width: 90%;
  max-width: 850px;
  margin: 0 auto 60px;
}

.train-card {
  background: rgba(2,6,23,0.88);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.train-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 15px;
}

.train-name {
  color: #e2e8f0;
  font-size: 1rem;
  font-weight: 600;
}

.train-number {
  color: #94a3b8;
  font-size: 0.78rem;
  margin-top: 3px;
}

.train-type {
  color: #a5b4fc;
  font-size: 0.75rem;
}

.route {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f172a;
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 14px;
}

.time {
  color: #e2e8f0;
  font-weight: 600;
}

.station {
  color: #94a3b8;
  font-size: 0.72rem;
}

.arrow {
  color: #6366f1;
  font-size: 1.2rem;
}

.availability-title {
  color: #94a3b8;
  font-size: 0.75rem;
  margin-bottom: 8px;
}

.availability-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.class-box {
  background: #0f172a;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 9px;
  text-align: center;
}

.class-name {
  color: #94a3b8;
  font-size: 0.72rem;
}

.class-status {
  color: #86efac;
  font-size: 0.8rem;
  font-weight: 600;
  margin-top: 3px;
}

.class-status.waiting {
  color: #fde68a;
}

.class-status.unavailable {
  color: #f87171;
}

.select-train {
  margin-top: 14px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 20px;
  background: #6366f1;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

.select-train:hover {
  background: #4f46e5;
}

/* ================= EMPTY ================= */

.empty {
  text-align: center;
  padding: 25px;
  color: #94a3b8;
  background: rgba(2,6,23,0.7);
  border-radius: 12px;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 768px) {

  nav {
    padding: 14px 20px;
    flex-direction: column;
    gap: 12px;
  }

  .logo {
    font-size: 2rem;
  }

  nav ul {
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  nav ul li a {
    font-size: 0.82rem;
  }

  .train-top {
    flex-direction: column;
  }

}

@media (max-width: 480px) {

  nav {
    padding: 12px 15px;
  }

  .logo {
    font-size: 1.8rem;
  }

  nav ul {
    gap: 12px;
  }

  nav ul li a {
    font-size: 0.76rem;
  }

  .formBox {
    width: 92%;
  }

  .availability-row {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<nav>

  <div class="logo">
    रेल<span style="color:#94a3b8;">Intel</span>
  </div>

  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#faqs">FAQs</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>

</nav>


<h2>Search Trains</h2>


<div class="formBox">

  <!-- FROM -->

  <div class="station-wrapper">

    <input
      id="from"
      placeholder="From station"
      autocomplete="off"
    >

    <div
      id="fromResults"
      class="station-results">
    </div>

  </div>


  <!-- TO -->

  <div class="station-wrapper">

    <input
      id="to"
      placeholder="To station"
      autocomplete="off"
    >

    <div
      id="toResults"
      class="station-results">
    </div>

  </div>


  <input
    type="date"
    id="date"
  >


  <hr class="divider">


  <div class="btn-row">

    <button
      class="btn-book"
      onclick="searchTrains()">
      Search Trains
    </button>

    <button
      class="btn-back"
      onclick="goBack()">
      ← Back
    </button>

  </div>


  <div id="status"></div>

</div>


<div id="trainResults"></div>


<script>

const API_BASE = "https://railintel-project.onrender.com";

let selectedFrom = null;
let selectedTo = null;

/* ================= DATE ================= */

document.addEventListener("DOMContentLoaded", function () {
    const dateInput = document.getElementById("date");

    if (!dateInput) return;

    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    dateInput.min = `${year}-${month}-${day}`;
});

/* ================= STATION SEARCH ================= */

function setupStationSearch(inputId, resultsId, type) {
    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    let timer;
    let controller;

    if (!input || !results) return;

    input.addEventListener("input", function () {
        clearTimeout(timer);

        if (controller) controller.abort();

        if (type === "from") {
            selectedFrom = null;
        } else {
            selectedTo = null;
        }

        const query = input.value.trim();
        results.innerHTML = "";

        if (query.length < 2) {
            results.style.display = "none";
            return;
        }

        timer = setTimeout(async function () {
            controller = new AbortController();

            try {
                const response = await fetch(
                    `${API_BASE}/api/stations/search?q=${encodeURIComponent(query)}`,
                    { signal: controller.signal }
                );

                const data = await response.json();

                if (!response.ok || data.success === false) {
                    throw new Error(
                        data.message ||
                        data.error?.message ||
                        `Station search failed (${response.status})`
                    );
                }

                const stations = Array.isArray(data.data)
                    ? data.data
                    : Array.isArray(data.data?.stations)
                        ? data.data.stations
                        : Array.isArray(data.data?.results)
                            ? data.data.results
                            : Array.isArray(data.stations)
                                ? data.stations
                                : [];

                results.innerHTML = "";

                if (stations.length === 0) {
                    showStationMessage(results, "No station found");
                    return;
                }

                stations.slice(0, 8).forEach(function (station) {
                    const code = String(
                        station.code ||
                        station.stationCode ||
                        station.station_code ||
                        station.station?.code ||
                        ""
                    ).trim();

                    const name = String(
                        station.name ||
                        station.stationName ||
                        station.station_name ||
                        station.station?.name ||
                        ""
                    ).trim();

                    if (!code || !name) return;

                    const item = document.createElement("div");
                    item.className = "station-item";

                    const nameElement = document.createElement("div");
                    nameElement.className = "station-name";
                    nameElement.textContent = name;

                    const codeElement = document.createElement("div");
                    codeElement.className = "station-code";
                    codeElement.textContent = code;

                    item.appendChild(nameElement);
                    item.appendChild(codeElement);

                    item.addEventListener("click", function () {
                        input.value = name;

                        if (type === "from") {
                            selectedFrom = { code, name };
                        } else {
                            selectedTo = { code, name };
                        }

                        results.style.display = "none";
                    });

                    results.appendChild(item);
                });

                if (results.children.length === 0) {
                    showStationMessage(
                        results,
                        "No usable station results"
                    );
                    return;
                }

                results.style.display = "block";

            } catch (error) {
                if (error.name === "AbortError") return;

                console.error("Station search error:", error);

                showStationMessage(
                    results,
                    "Unable to load stations. Try again."
                );
            }
        }, 350);
    });
}

function showStationMessage(results, message) {
    results.innerHTML = "";

    const item = document.createElement("div");
    item.className = "station-item";
    item.textContent = message;

    results.appendChild(item);
    results.style.display = "block";
}

/* ================= INITIALIZE ================= */

setupStationSearch("from", "fromResults", "from");
setupStationSearch("to", "toResults", "to");

/* ================= SEARCH TRAINS ================= */

async function searchTrains() {
    const fromInput = document.getElementById("from").value.trim();
    const toInput = document.getElementById("to").value.trim();
    const date = document.getElementById("date").value;

    const status = document.getElementById("status");
    const results = document.getElementById("trainResults");
    const button = document.querySelector(".btn-book");

    function showStatus(message, isError = false) {
        status.style.display = "block";
        status.style.color = isError ? "#f87171" : "#94a3b8";
        status.textContent = message;
    }

    if (!fromInput || !toInput || !date) {
        showStatus("Please select From, To and Journey Date.", true);
        return;
    }

    if (!selectedFrom || !selectedTo) {
        showStatus(
            "Please select both stations from the suggestions.",
            true
        );
        return;
    }

    if (selectedFrom.code === selectedTo.code) {
        showStatus("From and To stations cannot be the same.", true);
        return;
    }

    const selectedDate = new Date(`${date}T00:00:00`);
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (Number.isNaN(selectedDate.getTime()) || selectedDate < today) {
        showStatus("Please select a valid journey date.", true);
        return;
    }

    const originalButtonText = button.textContent;

    button.disabled = true;
    button.textContent = "Searching...";
    results.innerHTML = "";

    showStatus("Searching real trains...");

    try {
        const params = new URLSearchParams({
            from: selectedFrom.code,
            to: selectedTo.code,
            date
        });

        const response = await fetch(
            `${API_BASE}/api/trains?${params.toString()}`
        );

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error("Server returned an invalid response.");
        }

        if (!response.ok || data.success === false) {
            throw new Error(
                data.message ||
                data.error?.message ||
                `Train search failed (HTTP ${response.status}).`
            );
        }

        const trains = Array.isArray(data.data)
            ? data.data
            : Array.isArray(data.data?.trains)
                ? data.data.trains
                : Array.isArray(data.data?.results)
                    ? data.data.results
                    : Array.isArray(data.trains)
                        ? data.trains
                        : Array.isArray(data.results)
                            ? data.results
                            : [];

        if (trains.length === 0) {
            showStatus("No trains found for this route and date.");

            results.innerHTML = `
                <div class="empty">
                    No train results were returned for this route and date.
                    Please verify the stations and try again.
                </div>
            `;
            return;
        }

        let renderedCount = 0;

        for (const item of trains) {
            const card = renderTrain(item, date);

            if (card) renderedCount++;
        }

        if (renderedCount === 0) {
            showStatus("Train data was received but could not be displayed.", true);
            results.innerHTML = `
                <div class="empty">
                    The train data format was not recognised.
                    Check the backend API response.
                </div>
            `;
            return;
        }

        showStatus(`${renderedCount} train(s) found.`);

    } catch (error) {
        console.error("Train search error:", error);

        showStatus(
            error.message || "Unable to load trains. Please try again.",
            true
        );

        results.innerHTML = `
            <div class="empty">
                Unable to load train results. Please try again later.
            </div>
        `;
    } finally {
        button.disabled = false;
        button.textContent = originalButtonText;
    }
}

/* ================= RENDER TRAIN ================= */

function renderTrain(item, date) {
    const results = document.getElementById("trainResults");

    const train = item.train || item;
    const from = item.from || {};
    const to = item.to || {};

    const number = String(
        train.number ||
        train.trainNumber ||
        train.train_number ||
        ""
    ).trim();

    const name =
        train.name ||
        train.trainName ||
        train.train_name ||
        "Unknown Train";

    const type = train.type || train.trainType || "Express";

    const departure =
        from.departure ||
        from.departureTime ||
        item.departure ||
        "--";

    const arrival =
        to.arrival ||
        to.arrivalTime ||
        item.arrival ||
        "--";

    const duration = Number.isFinite(Number(item.duration))
        ? formatDuration(Number(item.duration))
        : item.duration || "--";

    if (!number) {
        console.warn("Skipping train with missing train number:", item);
        return null;
    }

    const card = document.createElement("div");
    card.className = "train-card";

    card.innerHTML = `
        <div class="train-top">
            <div>
                <div class="train-name">${escapeText(name)}</div>
                <div class="train-number">
                    Train No: ${escapeText(number)}
                </div>
            </div>
            <div class="train-type">${escapeText(type)}</div>
        </div>

        <div class="route">
            <div>
                <div class="time">${escapeText(departure)}</div>
                <div class="station">${escapeText(selectedFrom.code)}</div>
            </div>

            <div class="arrow">→</div>

            <div>
                <div class="time">${escapeText(arrival)}</div>
                <div class="station">${escapeText(selectedTo.code)}</div>
            </div>

            <div class="station">${escapeText(duration)}</div>
        </div>

        <div class="availability-title">Real Seat Availability</div>

        <div class="availability-row">
            <div class="class-box">
                <div class="class-name">SL</div>
                <div id="sl-${number}" class="class-status">Not checked</div>
            </div>

            <div class="class-box">
                <div class="class-name">3A</div>
                <div id="3a-${number}" class="class-status">Not checked</div>
            </div>

            <div class="class-box">
                <div class="class-name">2A</div>
                <div id="2a-${number}" class="class-status">Not checked</div>
            </div>
        </div>

        <button type="button" class="select-train check-availability">
            Check Availability
        </button>

        <button type="button" class="select-train select-this-train">
            Select Train
        </button>
    `;

    results.appendChild(card);

    const checkButton = card.querySelector(".check-availability");

    checkButton.addEventListener("click", async function () {
        checkButton.disabled = true;
        checkButton.textContent = "Checking...";

        try {
            // Sequential requests reduce simultaneous API load.
            await loadAvailability(number, "SL", date, `sl-${number}`);
            await loadAvailability(number, "3A", date, `3a-${number}`);
            await loadAvailability(number, "2A", date, `2a-${number}`);
        } catch (error) {
            console.error("Availability check failed:", error);
        } finally {
            checkButton.disabled = false;
            checkButton.textContent = "Refresh Availability";
        }
    });

    card.querySelector(".select-this-train").addEventListener(
        "click",
        function () {
            selectTrain(number, name);
        }
    );

    return card;
}

/* ================= SEAT AVAILABILITY ================= */

async function loadAvailability(
    trainNumber,
    classCode,
    journeyDate,
    elementId
) {
    const statusElement = document.getElementById(elementId);

    if (!statusElement) return;

    statusElement.textContent = "Checking...";
    statusElement.className = "class-status";

    try {
        const params = new URLSearchParams({
            trainNumber: String(trainNumber),
            source: selectedFrom.code,
            destination: selectedTo.code,
            journeyDate,
            classCode
        });

        const response = await fetch(
            `${API_BASE}/api/seat-availability?${params.toString()}`
        );

        let data;

        try {
            data = await response.json();
        } catch {
            data = null;
        }

        if (!response.ok || !data || data.success !== true) {
            const message =
                data?.message ||
                data?.error?.message ||
                `HTTP ${response.status}`;

            statusElement.textContent =
                response.status === 429 ? "Rate limited" : "Could not check";

            statusElement.className = "class-status unavailable";

            console.error(
                `Availability API error for ${trainNumber} (${classCode}):`,
                message,
                data
            );
            return;
        }

        const availability = String(data.availability || "").trim();
        const normalized = availability.toUpperCase();

        if (
            !availability ||
            ["N/A", "NA", "NULL", "UNDEFINED"].includes(normalized)
        ) {
            statusElement.textContent = "Not confirmed";
            statusElement.className = "class-status";
            return;
        }

        statusElement.textContent = availability;

        if (
            normalized.includes("AVAILABLE") &&
            !normalized.includes("NOT AVAILABLE")
        ) {
            statusElement.className = "class-status available";
        } else if (
            normalized.includes("RAC") ||
            normalized.includes("WL") ||
            normalized.includes("WAITLIST")
        ) {
            statusElement.className = "class-status waiting";
        } else if (
            normalized.includes("NOT AVAILABLE") ||
            normalized.includes("UNAVAILABLE") ||
            normalized.includes("REGRET") ||
            normalized.includes("CLOSED")
        ) {
            statusElement.className = "class-status unavailable";
        } else {
            statusElement.className = "class-status";
        }

    } catch (error) {
        console.error("Availability request failed:", error);

        statusElement.textContent = "Could not check";
        statusElement.className = "class-status unavailable";
    }
}

/* ================= SELECT TRAIN ================= */

function selectTrain(trainNumber, trainName) {
    const user = localStorage.getItem("railintelUser");

    if (!user) {
        alert("Please login before continuing.");
        window.location.href = "login.html";
        return;
    }

    localStorage.setItem(
        "selectedTrain",
        JSON.stringify({
            trainNumber,
            trainName,
            from: selectedFrom,
            to: selectedTo,
            journeyDate: document.getElementById("date").value
        })
    );

    alert("Train selected successfully!");
}

/* ================= DURATION ================= */

function formatDuration(minutes) {
    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;

    return `${hours}h ${mins}m`;
}

/* ================= ESCAPE TEXT ================= */

function escapeText(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

}
